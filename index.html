<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Helium11</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#ffffff;
  --card:#ffffff;
  --text:#000;
}
body.dark {
  --bg:#000000;
  --card:#181818;
  --text:#ffffff;
}

body{
  margin:0;
  font-family:Poppins,sans-serif;
  background:var(--bg);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--text);
  padding:20px;
}

.toggleWrap{
  position:fixed;
  top:18px;
  right:18px;
}

.switch{
  position:relative;
  display:inline-block;
  width:52px;
  height:28px;
}
.switch input{display:none;}
.slider{
  position:absolute;
  cursor:pointer;
  top:0;left:0;right:0;bottom:0;
  background:#ccc;
  transition:.4s;
  border-radius:50px;
}
.slider:before{
  position:absolute;
  content:"";
  height:22px;width:22px;
  left:3px;bottom:3px;
  background:white;
  transition:.4s;
  border-radius:50%;
}
input:checked + .slider{
  background:#ffb703;
}
input:checked + .slider:before{
  transform:translateX(24px);
}

.app{
  width:100%;
  max-width:520px;
  background:var(--card);
  padding:50px 35px;
  border-radius:20px;
  box-shadow:0 40px 100px rgba(0,0,0,.15);
  text-align:center;
}

.logoWrap{display:flex;align-items:center;justify-content:center;gap:12px;animation:bounce 2.2s infinite;}
.logoIcon{width:42px;height:42px;background:#ffb703;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;color:black;}
.logo{font-size:38px;font-weight:800;color:#ffb703;}
@keyframes bounce{0%,20%,50%,80%,100%{transform:translateY(0);}40%{transform:translateY(-12px);}60%{transform:translateY(-6px);}}

.subtitle{margin:20px 0 40px;}

.upload{border:2px dashed #ffb703;border-radius:14px;padding:28px;margin-bottom:30px;cursor:pointer;}

.generateWrap{margin-bottom:40px;}

button,.download{
  background:linear-gradient(90deg,#ffb703,#fb8500);
  border:none;
  border-radius:40px;
  padding:16px 40px;
  font-weight:800;
  cursor:pointer;
  transition:.4s;
  text-decoration:none;
  color:black;
  display:inline-block;
}

button:hover,.download:hover{
  box-shadow:0 18px 45px rgba(251,133,0,.7);
  transform:translateY(-3px) scale(1.06);
}

.download{
  visibility:hidden;
}
.download.show{
  visibility:visible;
}
</style>
</head>

<body>

<div class="toggleWrap">
  <label class="switch">
    <input type="checkbox" onchange="document.body.classList.toggle('dark')">
    <span class="slider"></span>
  </label>
</div>

<div class="app">
  <div class="logoWrap">
    <div class="logoIcon">H11</div>
    <div class="logo">Helium11</div>
  </div>

  <div class="subtitle">Convert Helium-10 exports into clean ASIN-level Excel files</div>

  <label class="upload">
    <span id="fileName">Click to upload CSV or Excel</span>
    <input type="file" id="fileInput" hidden>
  </label>

  <div class="generateWrap">
    <button onclick="processFile()">Generate Excel</button>
  </div>

  <a id="downloadLink" class="download">Download Refined Excel</a>
</div>

<script>
fileInput.onchange=e=>fileName.innerText=e.target.files[0].name;
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
const find=(r,k)=>{for(let c in r){for(let x of k){if(norm(c).includes(norm(x)))return r[c];}}return"N/A";}
const exact=(r,k)=>{for(let c in r){if(norm(c)===norm(k))return r[c];}return"N/A";}
function processFile(){
  const f=fileInput.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const wb=f.name.endsWith(".csv")?XLSX.read(e.target.result,{type:"string"}):XLSX.read(new Uint8Array(e.target.result),{type:"array"});
    const d=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
    const out=d.map(r=>({"Product Details":find(r,["title"]),"ASIN":find(r,["asin"]),"Price $":find(r,["price"]),"Sales":exact(r,"ASIN Sales"),"Revenue":exact(r,"ASIN Revenue")}));
    const sh=XLSX.utils.json_to_sheet(out),wb2=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb2,sh,"Refined");
    const ex=XLSX.write(wb2,{bookType:"xlsx",type:"binary"});
    const buf=new Uint8Array(ex.length);for(let i=0;i<ex.length;i++)buf[i]=ex.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([buf]));
    downloadLink.href=url;
    downloadLink.download="Helium11.xlsx";
    downloadLink.classList.add("show");
  };
  f.name.endsWith(".csv")?r.readAsText(f):r.readAsArrayBuffer(f);
}
</script>

</body>
</html>
