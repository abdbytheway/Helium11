<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Helium11</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#ffffff;
  --card:#ffffff;
  --text:#000;
}
body.dark{
  --bg:#000000;
  --card:#181818;
  --text:#ffffff;
}

body{
  margin:0;
  font-family:Poppins,sans-serif;
  background:var(--bg);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--text);
  padding:20px;
}

.toggleWrap{
  position:fixed;
  top:18px;
  right:18px;
}
.switch{
  width:52px;height:28px;position:relative;display:inline-block;
}
.switch input{display:none;}
.slider{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:#ccc;border-radius:50px;transition:.4s;cursor:pointer;
}
.slider:before{
  content:"";position:absolute;width:22px;height:22px;left:3px;bottom:3px;
  background:white;border-radius:50%;transition:.4s;
}
input:checked + .slider{background:#ffb703;}
input:checked + .slider:before{transform:translateX(24px);}

.app{
  width:100%;
  max-width:520px;
  background:var(--card);
  padding:50px 35px;
  border-radius:20px;
  box-shadow:0 40px 100px rgba(0,0,0,.15);
  text-align:center;
}

.logoWrap{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  animation:bounce 2.2s infinite;
}

.logoIcon{
  width:42px;height:42px;
  background:#ffb703;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;color:black;
}

.logo{
  font-size:38px;font-weight:800;color:#ffb703;
}

@keyframes bounce{
  0%,20%,50%,80%,100%{transform:translateY(0);}
  40%{transform:translateY(-12px);}
  60%{transform:translateY(-6px);}
}

.subtitle{
  margin:20px 0 40px;
  font-size:15px;
}

.upload{
  border:2px dashed #ffb703;
  border-radius:14px;
  padding:28px;
  margin-bottom:60px;
  cursor:pointer;
}

.generateWrap{
  margin-bottom:40px;
}

button,.download{
  background:linear-gradient(90deg,#ffb703,#fb8500);
  border:none;
  border-radius:40px;
  padding:16px 40px;
  font-weight:800;
  cursor:pointer;
  transition:.4s;
  text-decoration:none;
  color:black;
  display:inline-block;
}

button:hover,.download:hover{
  box-shadow:0 18px 45px rgba(251,133,0,.7);
  transform:translateY(-3px) scale(1.06);
}

.download{
  visibility:hidden;
}
.download.show{
  visibility:visible;
}
</style>
</head>

<body>

<div class="toggleWrap">
  <label class="switch">
    <input type="checkbox" onchange="document.body.classList.toggle('dark')">
    <span class="slider"></span>
  </label>
</div>

<div class="app">
  <div class="logoWrap">
    <div class="logoIcon">H11</div>
    <div class="logo">Helium11</div>
  </div>

  <div class="subtitle">Convert Helium-10 exports into clean ASIN-level Excel files</div>

  <label class="upload">
    <span id="fileName">Click to upload CSV or Excel</span>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden>
  </label>

  <div class="generateWrap">
    <button onclick="processFile()">Generate Excel</button>
  </div>

  <a id="downloadLink" class="download">Download Refined Excel</a>
</div>

<script>
fileInput.onchange = e => fileName.innerText = e.target.files[0].name;

const normalize = s => s.toLowerCase().replace(/[^a-z0-9]/g,"");

function findValue(row, keys){
  for(let col in row){
    let n = normalize(col);
    for(let k of keys){
      if(n.includes(normalize(k))) return row[col];
    }
  }
  return "N/A";
}

function getExact(row, key){
  for(let col in row){
    if(normalize(col) === normalize(key)) return row[col];
  }
  return "N/A";
}

function processFile(){
  const file = fileInput.files[0];
  if(!file) return alert("Upload a file first");

  const reader = new FileReader();
  reader.onload = e => {
    const wb = file.name.endsWith(".csv")
      ? XLSX.read(e.target.result, {type:"string"})
      : XLSX.read(new Uint8Array(e.target.result), {type:"array"});

    const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);

    const refined = data.map(row => ({
      "Product Details": findValue(row,["title","product","listing","name"]),
      "ASIN": findValue(row,["asin"]),
      "URL": findValue(row,["url","link"]),
      "Brand": findValue(row,["brand"]),
      "Ratings": findValue(row,["rating"]),
      "Review Count": findValue(row,["review"]),
      "Size": findValue(row,["size"]),
      "Pack": findValue(row,["pack"]),
      "Price $": findValue(row,["price","buybox","avg"]),
      "Sales": getExact(row,"ASIN Sales"),
      "Revenue": getExact(row,"ASIN Revenue"),
      "Category": findValue(row,["category"]),
      "BSR": findValue(row,["bsr","rank"]),
      "Creation Date": findValue(row,["date","created"])
    }));

    const sheet = XLSX.utils.json_to_sheet(refined);
    const wb2 = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb2,sheet,"Refined");

    const excel = XLSX.write(wb2,{bookType:"xlsx",type:"binary"});
    const buf = new Uint8Array(excel.length);
    for(let i=0;i<excel.length;i++) buf[i]=excel.charCodeAt(i);

    const url = URL.createObjectURL(new Blob([buf],{type:"application/octet-stream"}));
    downloadLink.href = url;
    downloadLink.download = "Helium11_Refined.xlsx";
    downloadLink.classList.add("show");
  };

  file.name.endsWith(".csv") ? reader.readAsText(file) : reader.readAsArrayBuffer(file);
}
</script>

</body>
</html>
