<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Helium11 Refiner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Inter, sans-serif;
  background:#f7f7f7;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  width:90%;
  max-width:820px;
  background:#fff;
  border-radius:18px;
  padding:60px 60px 50px;
  box-shadow:0 30px 80px rgba(0,0,0,.08);
  text-align:center;
}

h1{
  font-size:38px;
  font-weight:800;
  margin-bottom:10px;
}

.subtitle{
  color:#666;
  font-size:16px;
  margin-bottom:50px;
}

.uploadRow{
  display:flex;
  gap:20px;
  justify-content:center;
  align-items:center;
  margin-bottom:30px;
}

.uploadBox{
  flex:1;
  max-width:420px;
  border:2px dashed #ddd;
  border-radius:14px;
  padding:22px 20px;
  font-size:16px;
  cursor:pointer;
  transition:.3s;
}
.uploadBox:hover{
  border-color:#000;
}

.uploadBox span{
  color:#000;
}

input[type=file]{ display:none; }

.generateBtn{
  background:#000;
  color:#fff;
  border:none;
  padding:16px 34px;
  border-radius:40px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
  white-space:nowrap;
}
.generateBtn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.download{
  display:none;
  margin-top:25px;
  font-size:18px;
  font-weight:700;
  color:#000;
  text-decoration:none;
}
.download:hover{
  text-decoration:underline;
}

.footer{
  margin-top:35px;
  color:#aaa;
  font-size:14px;
}
</style>
</head>

<body>

<div class="card">
  <h1>Helium 10 Refiner</h1>
  <div class="subtitle">
    Turn messy Helium 10 exports into a clean ASIN-level Excel report.
  </div>

  <div class="uploadRow">
    <label class="uploadBox">
      <span id="fileName">Click to upload CSV or Excel</span>
      <input type="file" id="fileInput" accept=".csv,.xlsx,.xls">
    </label>

    <button class="generateBtn" onclick="processFile()">Generate Excel</button>
  </div>

  <a id="downloadLink" class="download">Download Refined Excel</a>

  <div class="footer">
    Works locally — no data is uploaded anywhere
  </div>
</div>

<script>
fileInput.onchange = e => {
  fileName.innerText = e.target.files[0].name;
};

const normalize = s => s.toLowerCase().replace(/[^a-z0-9]/g,"");

function findValue(row, keys){
  for(let col in row){
    let n = normalize(col);
    for(let k of keys){
      if(n.includes(normalize(k))) return row[col];
    }
  }
  return "N/A";
}

function getExact(row, key){
  for(let col in row){
    if(normalize(col) === normalize(key)) return row[col];
  }
  return "N/A";
}

function processFile(){
  const file = fileInput.files[0];
  if(!file) return alert("Please upload a Helium 10 file");

  const reader = new FileReader();
  reader.onload = e => {
    const wb = file.name.endsWith(".csv")
      ? XLSX.read(e.target.result,{type:"string"})
      : XLSX.read(new Uint8Array(e.target.result),{type:"array"});

    const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);

    const refined = data.map(row => ({
      "Product Details": findValue(row,["title","product","listing","name"]),
      "ASIN": findValue(row,["asin"]),
      "URL": findValue(row,["url","link"]),
      "Brand": findValue(row,["brand"]),
      "Ratings": findValue(row,["rating"]),
      "Review Count": findValue(row,["review"]),
      "Size": findValue(row,["size"]),
      "Pack": findValue(row,["pack"]),
      "Price $": findValue(row,["price","buybox","avg"]),
      "Sales": getExact(row,"ASIN Sales"),
      "Revenue": getExact(row,"ASIN Revenue"),
      "Category": findValue(row,["category"]),
      "BSR": findValue(row,["bsr","rank"]),
      "Creation Date": findValue(row,["date","created"])
    }));

    const sheet = XLSX.utils.json_to_sheet(refined);
    const wb2 = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb2,sheet,"Refined");

    const excel = XLSX.write(wb2,{bookType:"xlsx",type:"binary"});
    const buf = new Uint8Array(excel.length);
    for(let i=0;i<excel.length;i++) buf[i] = excel.charCodeAt(i);

    const url = URL.createObjectURL(new Blob([buf],{type:"application/octet-stream"}));
    downloadLink.href = url;
    downloadLink.download = "Helium11_Refined.xlsx";
    downloadLink.style.display="inline-block";
  };

  file.name.endsWith(".csv") ? reader.readAsText(file) : reader.readAsArrayBuffer(file);
}
</script>

</body>
</html>
